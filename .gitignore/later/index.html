<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noted</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <h1>Noted<span>.</span></h1>
    <div class="buttons-menu">
      <button class="add-note">Add Note</button>
      <button class="clear-all-notes">Clear Notes</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-header">
        <p>My Notes</p>
        <button class="plus-button">+</button>
      </div>
      <div class="note-list"></div>
    </div>

    <div class="text-boxes">
      <p class="empty-message">Select a note or create a new one.</p>
    </div>
  </main>

  <footer class="footer">Noted App</footer>

  <script src="script.js"></script>
</body>

</html>
