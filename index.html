<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noted</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <h1>Noted<span>.</span></h1>
    <div class="buttons-menu">
      <div class="sections-menu">
        <button class="sections-button">Section: Default</button>
        <div class="sections-card">
          <p>Choose a section</p>
          <button class="create-section">+ Create Section</button>
        </div>
      </div>
      <button class="add-note">Add Note</button>
      <button class="clear-all-notes">Clear Notes</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <button class="plus-button"><strong>+</strong></button>
    </div>

    <div class="editor">
      <div class="text-boxes"></div>
      <p class="word-count"></p>
    </div>
  </main>

  <footer class="footer">Noted App</footer>

  <div class="overlay">
    <div class="overlay-box">
      <h2>New Section</h2>
      <input class="section-name" type="text" placeholder="Enter section name">
      <div class="overlay-buttons">
        <button class="save-section">Create</button>
        <button class="cancel-section">Cancel</button>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
